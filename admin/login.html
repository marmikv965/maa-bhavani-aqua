<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Admin Login – Maa Bhavani Aqua Solutions</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#062e56 0%,#0a4f8f 50%,#1ba0d8 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem;}
.login-box{background:#fff;border-radius:20px;padding:2.5rem;width:100%;max-width:420px;box-shadow:0 24px 80px rgba(0,0,0,.25);}
.logo-row{display:flex;align-items:center;gap:.75rem;margin-bottom:2rem;justify-content:center;}
.logo-row img{height:52px;}
.brand{text-align:center;}
.brand .name{font-size:1.1rem;font-weight:800;color:#062e56;}
.brand .tag{font-size:.62rem;color:#1ba0d8;letter-spacing:.1em;text-transform:uppercase;}
h2{font-size:1.4rem;font-weight:700;color:#062e56;margin-bottom:.4rem;text-align:center;}
.sub{color:#64748b;font-size:.875rem;text-align:center;margin-bottom:2rem;}
.form-group{margin-bottom:1.25rem;}
label{display:block;font-size:.825rem;font-weight:600;color:#1a2535;margin-bottom:.4rem;}
input{width:100%;padding:.75rem 1rem;border:1.5px solid #dde3ec;border-radius:8px;font-size:.9rem;outline:none;transition:border-color .2s;}
input:focus{border-color:#1ba0d8;box-shadow:0 0 0 3px rgba(27,160,216,.12);}
.btn{width:100%;padding:.85rem;background:#0a4f8f;color:#fff;border:none;border-radius:8px;font-size:1rem;font-weight:700;cursor:pointer;transition:background .2s;margin-top:.5rem;}
.btn:hover{background:#062e56;}
.btn:disabled{background:#94a3b8;cursor:not-allowed;}
.error{background:#fee2e2;color:#991b1b;border:1px solid #fecaca;border-radius:6px;padding:.7rem 1rem;font-size:.85rem;margin-bottom:1rem;display:none;}
.back-link{text-align:center;margin-top:1.5rem;font-size:.82rem;color:#64748b;}
.back-link a{color:#0a4f8f;font-weight:600;}
</style>
<link rel="icon" type="image/png" href="../images/justlogo.png"/>
</head>
<body>
<div class="login-box">
  <div class="logo-row">
    <img src="../images/logo.jpeg" alt="Maa Bhavani"/>
    <div class="brand">
      <div class="name">MAA BHAVANI</div>
      <div class="tag">Admin Panel</div>
    </div>
  </div>
  <h2>Sign In</h2>
  <p class="sub">Enter your admin credentials to continue</p>
  <div class="error" id="errorMsg"></div>
  <form id="loginForm">
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="email" placeholder="admin@maabhavaniaqua.com" required autocomplete="email"/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Your password" required autocomplete="current-password"/>
    </div>
    <button type="submit" class="btn" id="loginBtn">Sign In →</button>
  </form>
  <div class="back-link"><a href="../index.html">← Back to Website</a></div>
</div>
<script>
const API = '/api';
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const errEl = document.getElementById('errorMsg');
  btn.disabled = true; btn.textContent = 'Signing in...';
  errEl.style.display = 'none';
  try {
    const res = await fetch(API + '/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value })
    });
    const data = await res.json();
    if (data.error) { errEl.textContent = data.error; errEl.style.display = 'block'; }
    else { localStorage.setItem('mba_token', data.token); window.location.href = 'index.html'; }
  } catch { errEl.textContent = 'Cannot connect to server. Make sure backend is running.'; errEl.style.display = 'block'; }
  btn.disabled = false; btn.textContent = 'Sign In →';
});
if (localStorage.getItem('mba_token')) window.location.href = 'index.html';
</script>
</body>
</html>
